# Linearized-NTK finetuning on ViT-B-16 / datacomp_xl_s13b_b90k.
#
# Same recipe as vision-ntk.yaml, retargeted to the datacomp backbone and to a
# checkpoint root on /work. Launch one dataset at a time -- datasets_order below
# lists all 20, so without --datasets the run would train every one of them:
#
#   python -m merge_and_rebase.finetune.train_vision \
#       --vision-config src/merge_and_rebase/finetune/configs/vision-ntk-vitb16-datacomp.yaml \
#       --datasets SVHN
#
# The custom SVHN preprocessing (resize 96 + pad + augmentation) is deliberately
# NOT configured here: the eval entrypoints do not read this file, so it travels
# as MR_SVHN_PREPROCESS / MR_SVHN_AUGMENTATION / MR_SVHN_TARGET_SIZE and must be
# exported for eval runs too. See scripts/sbatch_finetune_vision_svhn_vitb16_datacomp.sh
# and the SVHN section of steer4rebase_recap.md.

common:
  seed: 42
  deterministic: false

  device: cuda
  dtype: fp32

  backbone:
    name: openclip
    clip_model: ViT-B-16
    clip_pretrained: datacomp_xl_s13b_b90k

  data:
    batch_size: 16
    num_workers: 6            # keep sbatch --cpus-per-task >= this
    val_fraction: 0.1
    pin_memory: true

  train:
    epochs: null              # fallback if a dataset doesn't specify it
    optimizer:
      name: adamw
    lr: 1.0e-5
    weight_decay: 0.1
    accumulate_grad_batches: 8 # should be 128 / batch_size to simulate batch size of 128
    lr_scheduler:
      name: cosine              # cosine | linear | constant
      warmup_steps: 200
    grad_clip_norm: 1.0
    early_stopping: false       # patience below is inert while this is false
    early_stopping_patience: 1000

  strategy:
    name: full
    forward_mode: linearized_ntk
    forward_mode_params:
      linearized_feature_normalization: true
    params: {}

  output:
    save_format: full
    out_dir: /work/intesasanpaolo_phd/merge-and-rebase/checkpoints
    save_last_epoch: true

  logging:
    use_wandb: false
    project: null
    entity: null
    tags: []
    mode: online              # online | offline | disabled
    local_log_dir: null
    log_every_n_steps: 50
    run_name: null

# List of datasets you want to run, if you want the config to drive selection.
# You can still override via CLI --suite/--datasets.
datasets_order:
  - SUN397
  - Cars
  - RESISC45
  - EuroSAT
  - SVHN
  - GTSRB
  - MNIST
  - DTD
  - CIFAR100
  - STL10
  - Flowers102
  - OxfordIIITPet
  - PCAM
  - FER2013
  - EMNIST
  - CIFAR10
  - Food101
  - FashionMNIST
  - RenderedSST2
  - KMNIST

# Per-dataset overrides. Only put what changes from common.
datasets:
  SUN397:
    train:
      epochs: 14
  Cars:
    train:
      epochs: 35
  RESISC45:
    train:
      epochs: 15
  EuroSAT:
    train:
      epochs: 12
  SVHN:
    train:
      epochs: 4
  GTSRB:
    train:
      epochs: 11
  MNIST:
    train:
      epochs: 5
  DTD:
    train:
      epochs: 76
  CIFAR100:
    train:
      epochs: 6
  STL10:
    train:
      epochs: 6
  Flowers102:
    train:
      epochs: 147
  OxfordIIITPet:
    train:
      epochs: 82
  PCAM:
    train:
      epochs: 1
  FER2013:
    train:
      epochs: 10
  EMNIST:
    train:
      epochs: 2
  CIFAR10:
    train:
      epochs: 6
  Food101:
    train:
      epochs: 4
  FashionMNIST:
    train:
      epochs: 5
  RenderedSST2:
    train:
      epochs: 39
  KMNIST:
